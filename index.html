<script>
gsap.registerPlugin(ScrollTrigger);
/* ===== KONFIGURASI ===== */
const MEMBERS=['Alifah Mumtazah','Difa Amelia','Faradisa Salsabila','Fatia Tunnisa','Kafka Nafisa','Muhammad Adam Sanjaya','Munira Muhirah','Nadia Riska Salsabila','Nadira Raysa','Nargis Fidella','Naysya Dilla Kinaya','Putri Audya','Putri Balqis','Tina Fitriana','Tri Andini'];
const ROLE={'Muhammad Adam Sanjaya':'Komting','Faradisa Salsabila':'Bendahara','Nargis Fidella':'Sekretaris'};
const SUPABASE_URL='https://iivavouxbutqezdwdxnz.supabase.co';
const SUPABASE_KEY='sb_publishable_IAxERLMZlPD9y6igM07IeQ_ZY6prkJN';
const ADMIN_UID='41e4f830-5fb5-4842-affd-f415464babe7';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null, saveTimer=null, remoteReady=false;
/* ===== DATA ===== */
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let ADM=false;
let S={};try{S=JSON.parse(localStorage.getItem('ub-v2')||localStorage.getItem('ub-v1'))||{}}catch(e){S={}}
S.m=S.m||{};S.b=S.b||{};S.g=S.g||{};
S.v=S.v||{visi:'Menjadi unit yang kompak, berintegritas, dan berkarya bersama untuk pelayanan publik yang lebih baik. (Klik teks ini saat mode admin untuk mengubah.)',misi:['Membangun kolaborasi yang saling menguatkan antar anggota.','Menjalankan kegiatan yang bermanfaat bagi kampus dan masyarakat.','Mendokumentasikan setiap langkah agar menjadi cerita yang berkesan.']};
const lorem='Tulis keterangan foto di sini: apa yang terjadi, siapa yang terlibat, dan kesan dari momen ini.';
S.k=S.k||[{id:'k1',t:'Kegiatan Pertama',d:'Tanggal kegiatan',ph:[{img:'',h:'Judul foto utama',x:lorem},{img:'',h:'Judul foto kedua',x:lorem},{img:'',h:'Judul foto ketiga',x:lorem}]}];
async function uploadImages(value){
 if(typeof value==='string' && value.startsWith('data:image/')){
  const parts=value.split(','); const mime=(parts[0].match(/data:(.*?);/)||[])[1]||'image/jpeg';
  const bytes=Uint8Array.from(atob(parts[1]),c=>c.charCodeAt(0));
  const ext=mime.includes('png')?'png':mime.includes('webp')?'webp':'jpg';
  const path=`${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
  const {error}=await db.storage.from('unitb-foto').upload(path,new Blob([bytes],{type:mime}),{contentType:mime,upsert:false});
  if(error) throw error;
  return db.storage.from('unitb-foto').getPublicUrl(path).data.publicUrl;
 }
 if(Array.isArray(value)) return Promise.all(value.map(uploadImages));
 if(value && typeof value==='object'){const out={};for(const [k,v] of Object.entries(value))out[k]=await uploadImages(v);return out;}
 return value;
}
async function save(){
 try{localStorage.setItem('ub-v2',JSON.stringify(S));}catch(e){}
 if(!ADM || !remoteReady) return;
 clearTimeout(saveTimer);
 saveTimer=setTimeout(async()=>{
  try{
   const clean=await uploadImages(S);
   S=clean; localStorage.setItem('ub-v2',JSON.stringify(S));
   const {error}=await db.from('unitb_site').update({content:S,updated_at:new Date().toISOString()}).eq('id',1);
   if(error) throw error;
   toast('Perubahan tersimpan untuk semua perangkat');
  }catch(e){console.error(e);toast('Gagal menyimpan ke database: '+(e.message||'periksa koneksi'));}
 },500);
} 
async function loadRemote(){
 const {data,error}=await db.from('unitb_site').select('content').eq('id',1).single();
 if(error) throw error;
 const remote=data?.content;
 if(remote && Object.keys(remote).length){S=remote;}
 else if(ADM){await save();}
 remoteReady=true;
}
function toast(t){const e=$('#toast');e.textContent=t;gsap.fromTo(e,{opacity:0,y:20},{opacity:1,y:0,duration:.4,yoyo:true,repeat:1,repeatDelay:2})}
const bg=i=>`linear-gradient(145deg,hsl(${18+(i*9)%24} 14% ${88-(i*3)%9}%),hsl(28 10% ${74-(i*2)%6}%))`;
const sty=(img,i)=>img?`background-image:url('${img}')`:`background-image:${bg(i)}`;
const sp=t=>t.split(' ').map(w=>`<span class="w">${[...w].map(c=>`<i>${esc(c)}</i>`).join('')}</span>`).join(' ');
const ini=n=>n.split(' ').slice(0,2).map(x=>x[0]).join('');

/* ===== MODAL ===== */
function modal(html,cls,fly){const m=document.createElement('div');m.className='modal';m.setAttribute('data-lenis-prevent','');m.innerHTML=`<div class="mb ${cls||''}">${html}<button class="bkm" aria-label="Kembali">&larr;</button></div>`;document.body.append(m);const b=$('.mb',m);
gsap.from(m,{opacity:0,duration:.5});if(!fly)gsap.from(b,{y:60,scale:.94,opacity:0,duration:.8,ease:'expo.out'});

const o=modal(`<div class="im" style="${sty(S.m[i],i)}">${S.m[i]?'':ini(n)}</div><div class="tx"><small>${ROLE[n]||'Anggota'}</small><h2>${esc(n)}</h2><p class="d" id="bo" ${ce} data-ph="Tulis deskripsi diri...">${esc(ADM?(S.b[i]||''):(S.b[i]||'Belum ada deskripsi.'))}</p><div class="igr">${ADM?`<span class="igi">${IG}</span><b id="ig" contenteditable="true" data-ph="username instagram">${esc(g)}</b>`:g?`<a class="igl" target="_blank" rel="noopener" href="https://instagram.com/${esc(g)}" aria-label="Instagram ${esc(g)}">${IG}</a>`:''}</div><button class="btn ao" id="chg">Ganti foto</button></div>`,'mm',true);
const {m,b}=o,im=$('.im',b),tx=$$('.tx > *',b);gsap.set(b,{opacity:0});gsap.set([...tx,$('.bkm',b)],{opacity:0});
const r=card.getBoundingClientRect(),t=im.getBoundingClientRect(),c=card.cloneNode(true);document.body.append(c);
gsap.set(c,{position:'fixed',left:r.left,top:r.top,width:r.width,height:r.height,margin:0,zIndex:95,rotationX:0,rotationY:0,scale:1,opacity:1,y:0,x:0,transformPerspective:1000,pointerEvents:'none'});card.style.visibility='hidden';
o.onclose=()=>{card.style.visibility='';c.remove()};
gsap.timeline().to($('h4',c),{opacity:0,duration:.25},0).to(c,{left:t.left,top:t.top,width:t.width,height:t.height,borderRadius:0,rotationY:360,duration:1.1,ease:'power3.inOut'},0)
.add(()=>{gsap.set(b,{opacity:1});c.remove();gsap.from(b,{scale:1.0,duration:.01})})
.to($('.bkm',b),{opacity:1,duration:.4},'>').to(tx,{opacity:1,y:0,startAt:{y:40},stagger:.1,duration:.8,ease:'power3.out'},'<');

/* ===== LOGIN ===== */
function setAdm(v){ADM=v;document.body.classList.toggle('adm',v);renderVisi(false);renderKeg(false);buildTeam()}
function loginM(){if(ADM){const o=modal(`<div class="tx"><small>ADMIN</small><h2 style="font-size:34px">Keluar dari mode admin?</h2><div class="pn"><button class="btn r" id="y">Keluar</button><button class="btn" id="n">Batal</button></div></div>`,'lm');$('#y',o.b).onclick=async()=>{await db.auth.signOut();currentUser=null;setAdm(false);o.close();toast('Keluar dari mode admin')};$('#n',o.b).onclick=o.close;return}
const o=modal(`<div class="tx"><small>ADMIN</small><h2>Masuk</h2><label class="fl"><span>Email admin</span><input id="lu" type="email" placeholder="Email admin" autocomplete="username"></label><label class="fl"><span>Password</span><input id="lp" type="password" placeholder="Password" autocomplete="current-password"></label><p class="d" id="le" role="alert" style="color:var(--rd);font-weight:700"></p><button type="button" class="btn r" id="lg">Masuk</button></div>`,'lm'),b=o.b;
const go=async()=>{const email=$('#lu',b).value.trim(),password=$('#lp',b).value,er=$('#le',b);if(!email||!password){er.textContent='Isi email dan password.';return}

 if(error){er.textContent='Login gagal. Periksa email dan password.';return}
 if(data.user.id!==ADMIN_UID){await db.auth.signOut();er.textContent='Akun ini bukan admin website.';return}
 currentUser=data.user;ADM=true;setAdm(true);o.close();
 try{const {data:row,error:readErr}=await db.from('unitb_site').select('content').eq('id',1).single();if(readErr)throw readErr;
  if(row?.content&&Object.keys(row.content).length){S=row.content;localStorage.setItem('ub-v2',JSON.stringify(S));buildTeam();renderVisi(false);renderKeg(false);}

  remoteReady=true;toast('Berhasil masuk sebagai admin');

};

const hs=$$('[data-h]',b),xs=$$('[data-x]',b);S.k.unshift({id:'k'+Date.now(),t,d:$('#ad',b).value.trim()||'Tanggal kegiatan',ph:imgs.map((u,j)=>({img:u,h:hs[j].value.trim()||'Judul foto',x:xs[j].value.trim()||lorem}))});save();o.close();renderKeg(false);
const f=$('.ka');gsap.from(f,{y:80,opacity:0,scale:.92,duration:1.1,ease:'expo.out',delay:.4});ScrollTrigger.refresh();sc($('#keg').getBoundingClientRect().top+scrollY);toast('Kegiatan ditambahkan')}}
/* ===== EVENTS ===== */
document.addEventListener('click',async e=>{const t=e.target;
if(t.closest('[data-login]'))return loginM();

const ka=t.closest('.ka');if(ka){const a=S.k.find(x=>x.id===ka.dataset.id);if(!a||!ADM)return;

const dm=t.closest('[data-delm]');if(dm){S.v.misi.splice(+dm.dataset.delm,1);save();renderVisi(false)}});
document.addEventListener('input',e=>{const t=e.target;const ka=t.closest&&t.closest('.ka');if(ka&&t.dataset.f){const a=S.k.find(x=>x.id===ka.dataset.id);if(a){if(t.dataset.j!==undefined)a.ph[+t.dataset.j][t.dataset.f]=t.textContent;else a[t.dataset.f]=t.textContent;save()}return}if(t.dataset.v){S.v.visi=t.textContent;save()}else if(t.dataset.m!==undefined){S.v.misi[+t.dataset.m]=t.textContent;save()}});

if(!t||t.style.visibility==='hidden')return;last=t;const r=t.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
gsap.to(t,{rotationY:(x-.5)*22,rotationX:(.5-y)*22,scale:1.05,transformPerspective:900,duration:.4,ease:'power2.out'});t.style.setProperty('--mx',x*100+'%');t.style.setProperty('--my',y*100+'%')});
['pointerup','pointercancel'].forEach(n=>document.addEventListener(n,e=>e.pointerType!=='mouse'&&rs()));
const gx=gsap.quickTo('#glow','x',{duration:.8}),gy=gsap.quickTo('#glow','y',{duration:.8});HV&&addEventListener('pointermove',e=>{gx(e.clientX);gy(e.clientY)});
/* ===== INIT ===== */
async function initApp(){
 try{const {data}=await db.auth.getSession();currentUser=data.session?.user||null;ADM=!!(currentUser&&currentUser.id===ADMIN_UID);if(currentUser&&!ADM)await db.auth.signOut();}catch(e){console.warn(e)}

gsap.from('#tag',{opacity:0,y:24,letterSpacing:'.08em',duration:1.5,delay:.9,ease:'expo.out'});gsap.from('.hi',{opacity:0,y:24,duration:1,delay:1.6});gsap.from('.orb',{scale:.3,opacity:0,duration:2,ease:'power3.out'});

 db.channel('unitb-site-live').on('postgres_changes',{event:'UPDATE',schema:'public',table:'unitb_site',filter:'id=eq.1'},payload=>{
  if(ADM || !payload.new?.content) return;
  S=payload.new.content;
  try{localStorage.setItem('ub-v2',JSON.stringify(S))}catch(e){}
  buildTeam();renderVisi(false);renderKeg(false);ScrollTrigger.refresh();
